# Dependabot opens PRs for dependency updates; each must pass CI like any
# other PR. Minor and patch updates are grouped into one PR per ecosystem
# each week. Major updates still get their own PR, since they can break things.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(ui)"

  # The versions in uses: lines (actions/checkout@v4 and so on).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
