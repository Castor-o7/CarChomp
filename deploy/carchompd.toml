# Installed as /etc/carchomp/carchompd.toml. All keys: carchompd.example.toml

# Peer authentication over the local socket: no password to keep anywhere.
database_url = "postgres:///carchomp?host=/var/run/postgresql"
listen = "0.0.0.0:80"
ui_dir = "/usr/share/carchomp/ui"
maps_dir = "/var/lib/carchomp/maps"
gpsd = "127.0.0.1:2947"
# aprs_kiss = "127.0.0.1:8001"
