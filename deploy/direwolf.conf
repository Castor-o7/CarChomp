# Direwolf for carchomp (deploy/install.sh --radio): decode APRS from rtl_fm on
# standard input and serve it on the KISS port. Receive only: no transmit
# audio, no PTT, no beacons, no digipeating, no IGate.
ADEVICE null null
CHANNEL 0
MODEM 1200
KISSPORT 8001
# carchompd speaks KISS; no AGW network interface.
AGWPORT 0
