[package]
name = "carchompd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The carchomp daemon: sources -> bus -> PostgreSQL, WebSocket, REST"

[dependencies]
carchomp-core = { path = "../carchomp-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
rustix = { version = "1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "time", "migrate", "macros"] }
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
